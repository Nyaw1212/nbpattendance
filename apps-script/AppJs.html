<script>
(function(){
  const state={personnel:[],offices:[],leaveTypes:[],camp:'',office:'',date:'',activeDay:'',cells:{},search:'',hover:null,pendingRanges:[]};
  const LABEL={PRESENT:'P',OFF:'O',LEAVE:'L',OB:'OB',ABSENT:'A',UNRECORDED:'—',ACT:'ACT',TRN:'TRN',UI:'UI',AWOL:'AWOL',AWA:'AWA',SUS:'SUS',DET:'DET',DEC:'DEC',DIS:'DIS',RET:'RET'};
  const PERSONNEL_STATUSES=[['ACT','Active / On Duty'],['OB','Official Business'],['TRN','In Training'],['UI','Under Investigation'],['AWOL','AWOL'],['AWA','AWA'],['SUS','On Suspension'],['DET','Detained'],['DEC','Deceased'],['DIS','Dismissed'],['RET','Retired']];
  const $=id=>document.getElementById(id);
  function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
  function parseIso(v){return new Date(v+'T12:00:00')}
  function weekFrom(v){const s=parseIso(v),sun=new Date(s);sun.setDate(s.getDate()-s.getDay());return Array.from({length:7},(_,i)=>{const d=new Date(sun);d.setDate(sun.getDate()+i);return d})}
  function key(emp,date){return emp+'|'+date}
  function defaultStatus(i){return i===0||i===6?'OFF':'PRESENT'}
  function leaveCode(v){if(!v)return'L';const m=v.match(/\(([^)]+)\)/);if(m&&m[1])return m[1].toUpperCase();const w=v.trim().split(/\s+/).filter(Boolean);return (w.length===1?w[0].slice(0,3):w.map(x=>x[0]).join('').slice(0,3)).toUpperCase()}
  function caseLabel(c){return c.status==='LEAVE'?leaveCode(c.leaveType):(LABEL[c.status]||c.status)}
  function shortDate(v){return parseIso(v).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
  function datesBetween(a,b){const s=parseIso(a),e=parseIso(b),out=[];for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))out.push(iso(d));return out}
  function addDuration(start,amount,unit){const d=parseIso(start),n=Math.max(1,Math.floor(Number(amount)||1));if(unit==='days')d.setDate(d.getDate()+n-1);else if(unit==='weeks')d.setDate(d.getDate()+n*7-1);else{const original=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(original,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));d.setDate(d.getDate()-1)}return iso(d)}
  function officeRoster(){return state.personnel.filter(p=>p.camp===state.camp&&p.office===state.office)}
  function roster(){const q=state.search.toLowerCase();return officeRoster().filter(p=>!q||p.fullName.toLowerCase().includes(q)||p.badgeNumber.includes(q)).sort((a,b)=>a.fullName.localeCompare(b.fullName))}
  function seedWeek(){const w=weekFrom(state.date),next={};officeRoster().forEach(p=>w.forEach((d,i)=>next[key(p.badgeNumber,iso(d))]={status:defaultStatus(i)}));state.cells=next;state.activeDay=iso(w[0]);}
  function getRange(emp,c,focus){const exact=state.pendingRanges.find(r=>r.employeeKey===emp&&r.status===c.status&&(r.leaveType||'')===(c.leaveType||'')&&focus>=r.startDate&&focus<=r.endDate);if(exact)return{startDate:exact.startDate,endDate:exact.endDate,days:datesBetween(exact.startDate,exact.endDate).length};const wd=weekFrom(state.date).map(iso),i=wd.indexOf(focus);if(i<0)return{startDate:focus,endDate:focus,days:1};const match=d=>{const x=state.cells[key(emp,d)];return x&&x.status===c.status&&(x.leaveType||'')===(c.leaveType||'')};let l=i,r=i;while(l>0&&match(wd[l-1]))l--;while(r<wd.length-1&&match(wd[r+1]))r++;return{startDate:wd[l],endDate:wd[r],days:r-l+1}}
  function setStatus(msg){$('status').textContent=msg;$('footerMessage').textContent=msg}
  function renderSelectors(){const camps=[...new Set(state.offices.map(o=>o.camp))];$('camp').innerHTML=camps.map(c=>'<option>'+escapeHtml(c)+'</option>').join('');if(!state.camp)state.camp=camps[0]||'';$('camp').value=state.camp;const opts=state.offices.filter(o=>o.camp===state.camp).sort((a,b)=>a.sortOrder-b.sortOrder);$('office').innerHTML=opts.map(o=>'<option>'+escapeHtml(o.office)+'</option>').join('');if(!opts.some(o=>o.office===state.office))state.office=opts[0]?opts[0].office:'';$('office').value=state.office;$('date').value=state.date}
  function render(){renderWeekLabel();renderGrid();renderSummary()}
  function renderWeekLabel(){const w=weekFrom(state.date);$('weekLabel').textContent=w[0].toLocaleDateString()+' – '+w[6].toLocaleDateString()}
  function renderGrid(){const w=weekFrom(state.date),rows=roster();let html='<table class="attendance-grid"><thead><tr><th>Personnel</th>';w.forEach(d=>{const di=iso(d);html+='<th class="'+(di===state.activeDay?'active-day':'')+'"><button class="day-head" data-day="'+di+'"><span>'+d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()+'</span><small>'+(d.getMonth()+1)+'/'+d.getDate()+'</small></button></th>'});html+='</tr></thead><tbody>';rows.forEach(p=>{const ph=state.hover&&state.hover.employeeKey===p.badgeNumber;html+='<tr><td class="person-name '+(ph?'hover-person':'')+'" data-person="'+escAttr(p.badgeNumber)+'"><b>'+escapeHtml(p.fullName)+'</b><small>'+escapeHtml(p.rank)+' · Badge '+escapeHtml(p.badgeNumber)+'</small></td>';w.forEach(day=>{const di=iso(day),c=state.cells[key(p.badgeNumber,di)]||{status:'UNRECORDED'},display=caseLabel(c),special=c.status!=='PRESENT'&&c.status!=='OFF',ih=state.hover&&state.hover.employeeKey===p.badgeNumber&&di>=state.hover.startDate&&di<=state.hover.endDate&&state.hover.status===c.status&&(state.hover.leaveType||'')===(c.leaveType||'');html+='<td class="'+(di===state.activeDay?'active-col ':'')+(ih?'hover-cell':'')+'"><div class="status-cell" data-emp="'+escAttr(p.badgeNumber)+'" data-day="'+di+'"><button class="status-btn '+(special?'status-special':c.status==='PRESENT'?'status-present':'status-off')+' '+(ih?'hover-btn':'')+'" data-action="cycle">'+escapeHtml(display)+'</button>'+(special?'<button class="details" data-action="edit">⋯</button>':'')+'</div></td>'});html+='</tr>'});html+='</tbody></table>';$('gridWrap').innerHTML=html;bindGrid()}
  function renderSummary(){const active=parseIso(state.activeDay),cases=officeRoster().map(p=>({person:p,cell:state.cells[key(p.badgeNumber,state.activeDay)]||{status:'UNRECORDED'}})).filter(x=>!['PRESENT','OFF','ACT'].includes(x.cell.status)).sort((a,b)=>a.person.fullName.localeCompare(b.person.fullName));$('activeDayLabel').textContent=active.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});$('caseCount').textContent=cases.length;const counts={LEAVE:0,OB:0,ABSENT:0,UNRECORDED:0};cases.forEach(x=>{if(counts[x.cell.status]!==undefined)counts[x.cell.status]++});$('caseChips').innerHTML=['Leave','OB','Absent','Unrecorded'].map((n,i)=>'<span>'+n+' <b>'+counts[['LEAVE','OB','ABSENT','UNRECORDED'][i]]+'</b></span>').join('');$('caseList').innerHTML=cases.length?cases.map(x=>{const r=getRange(x.person.badgeNumber,x.cell,state.activeDay);return '<div class="case-row" data-summary="'+escAttr(x.person.badgeNumber)+'"><div><b>'+escapeHtml(x.person.fullName)+'</b><small>'+escapeHtml(x.person.rank)+' · Badge '+escapeHtml(x.person.badgeNumber)+'</small><small>'+shortDate(r.startDate)+' → '+shortDate(r.endDate)+' · '+r.days+' day'+(r.days===1?'':'s')+'</small></div><span class="case-code">'+escapeHtml(caseLabel(x.cell))+'</span></div>'}).join(''):'<div class="empty">No personnel statuses or movements to show for this day.</div>';document.querySelectorAll('[data-summary]').forEach(el=>{el.onmouseenter=()=>{const emp=el.dataset.summary,c=state.cells[key(emp,state.activeDay)];if(c){const r=getRange(emp,c,state.activeDay);state.hover={employeeKey:emp,status:c.status,leaveType:c.leaveType,startDate:r.startDate,endDate:r.endDate};applyHoverDom()}};el.onmouseleave=()=>{state.hover=null;applyHoverDom()}})}
  function applyHoverDom(){document.querySelectorAll('.person-name').forEach(el=>el.classList.remove('hover-person'));document.querySelectorAll('.hover-cell').forEach(el=>el.classList.remove('hover-cell'));document.querySelectorAll('.hover-btn').forEach(el=>el.classList.remove('hover-btn'));if(!state.hover)return;const person=document.querySelector('.person-name[data-person="'+cssEscape(state.hover.employeeKey)+'"]');if(person)person.classList.add('hover-person');document.querySelectorAll('.status-cell[data-emp="'+cssEscape(state.hover.employeeKey)+'"]').forEach(el=>{const day=el.dataset.day,c=state.cells[key(state.hover.employeeKey,day)];if(day>=state.hover.startDate&&day<=state.hover.endDate&&c&&c.status===state.hover.status&&(c.leaveType||'')===(state.hover.leaveType||'')){const td=el.closest('td');if(td)td.classList.add('hover-cell');const btn=el.querySelector('.status-btn');if(btn)btn.classList.add('hover-btn')}})}
  function bindGrid(){document.querySelectorAll('.day-head').forEach(b=>b.onclick=()=>{state.activeDay=b.dataset.day;render()});document.querySelectorAll('[data-person]').forEach(td=>{td.onmouseenter=()=>{const emp=td.dataset.person,c=state.cells[key(emp,state.activeDay)]||{status:'UNRECORDED'},r=getRange(emp,c,state.activeDay);state.hover={employeeKey:emp,status:c.status,leaveType:c.leaveType,startDate:r.startDate,endDate:r.endDate};applyHoverDom()};td.onmouseleave=()=>{state.hover=null;applyHoverDom()}});document.querySelectorAll('.status-cell').forEach(el=>{const emp=el.dataset.emp,day=el.dataset.day;el.onmouseenter=()=>{const c=state.cells[key(emp,day)];if(c){const r=getRange(emp,c,day);state.hover={employeeKey:emp,status:c.status,leaveType:c.leaveType,startDate:r.startDate,endDate:r.endDate};applyHoverDom()}};el.onmouseleave=()=>{state.hover=null;applyHoverDom()};el.querySelector('[data-action="cycle"]').onclick=e=>{e.stopPropagation();cycleCell(emp,day)};const edit=el.querySelector('[data-action="edit"]');if(edit)edit.onclick=e=>{e.stopPropagation();openExisting(emp,day)}})}
  function cycleCell(emp,day){state.activeDay=day;const k=key(emp,day),c=state.cells[k]||{status:'UNRECORDED'};if(c.status==='PRESENT'){state.cells[k]={status:'OFF'};render();return}if(c.status==='OFF'||c.status==='UNRECORDED'){openTypeChoice(emp,day);return}state.cells[k]={status:'PRESENT'};render()}
  function personByBadge(emp){return state.personnel.find(p=>p.badgeNumber===emp)}
  function modal(title,sub,body,small){$('modalRoot').innerHTML='<div class="modal-backdrop"><section class="modal '+(small?'small':'')+'"><div class="modal-head"><div><strong>'+escapeHtml(title)+'</strong><small>'+escapeHtml(sub||'')+'</small></div><button id="modalClose">×</button></div>'+body+'</section></div>';$('modalClose').onclick=closeModal;document.querySelector('.modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)closeModal()}}
  function closeModal(){$('modalRoot').innerHTML=''}
  function openTypeChoice(emp,day){const p=personByBadge(emp);modal('Select attendance type',p.fullName+' · '+shortDate(day),'<div class="choice-grid"><button id="chooseLeave"><b>LV</b><span>Leave</span></button><button id="chooseStatus"><b>STS</b><span>Personnel Status / Movement</span></button></div>',true);$('chooseLeave').onclick=()=>openLeave(emp,day);$('chooseStatus').onclick=()=>openStatus(emp,day)}
  function openLeave(emp,day){const p=personByBadge(emp);modal('Select leave type',p.fullName+' · '+shortDate(day),'<div class="choice-grid">'+state.leaveTypes.map(t=>'<button data-leave="'+escAttr(t)+'"><b>'+escapeHtml(leaveCode(t))+'</b><span>'+escapeHtml(t)+'</span></button>').join('')+'</div>');document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=()=>openRange(emp,day,'LEAVE',b.dataset.leave))}
  function openStatus(emp,day){const p=personByBadge(emp);modal('Select personnel status',p.fullName+' · '+shortDate(day),'<div class="choice-grid">'+PERSONNEL_STATUSES.map(x=>'<button data-st="'+x[0]+'"><b>'+x[0]+'</b><span>'+escapeHtml(x[1])+'</span></button>').join('')+'</div>');document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>openRange(emp,day,b.dataset.st,null))}
  function openExisting(emp,day){const c=state.cells[key(emp,day)];if(!c)return;if(c.status==='LEAVE')openLeave(emp,day);else openStatus(emp,day)}
  function calendarHtml(month,start,end){const first=new Date(month.getFullYear(),month.getMonth(),1),last=new Date(month.getFullYear(),month.getMonth()+1,0),gridStart=new Date(first);gridStart.setDate(1-first.getDay());let html='<div class="range-calendar"><div class="calendar-top"><button id="calPrev" aria-label="Previous month">‹</button><strong>'+first.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</strong><button id="calNext" aria-label="Next month">›</button></div><div class="calendar-weekdays">'+['Su','Mo','Tu','We','Th','Fr','Sa'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="calendar-days">';for(let i=0;i<42;i++){const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);const di=iso(d),outside=d.getMonth()!==month.getMonth(),selected=di===start||di===end,inRange=start&&end&&di>=start&&di<=end;html+='<button class="cal-day '+(outside?'outside ':'')+(inRange?'in-range ':'')+(selected?'selected':'')+'" data-cal-day="'+di+'">'+d.getDate()+'</button>'}return html+'</div><div class="calendar-foot"><span>First click = start · second click = end</span><button id="calToday">Today</button></div></div>'}
  function openRange(emp,day,status,leaveType){const p=personByBadge(emp),range={start:day,end:day,anchorSet:false,month:new Date(parseIso(day).getFullYear(),parseIso(day).getMonth(),1)};const body=()=>'<div class="range-body"><div class="range-fields"><label><span>START DATE</span><input id="rangeStart" type="date" value="'+range.start+'"></label><label><span>END DATE</span><input id="rangeEnd" type="date" value="'+range.end+'"></label></div><div id="calendarHost">'+calendarHtml(range.month,range.start,range.end)+'</div><div class="duration-row"><div><b>OR ENTER DURATION</b><small>Useful for long leaves such as maternity leave.</small></div><input id="durationValue" type="number" min="1" placeholder="e.g. 105"><select id="durationUnit"><option value="days">Days</option><option value="weeks">Weeks</option><option value="months">Months</option></select><button id="setEndDate">Set end date</button></div><div class="range-summary"><span id="rangeText">'+range.start+' → '+range.end+'</span><b id="rangeDays">'+datesBetween(range.start,range.end).length+' day</b></div></div><div class="range-actions"><button id="rangeCancel">Cancel</button><button id="rangeApply" class="primary">Apply date range</button></div>';
    modal('Select date range',p.fullName+' · '+(leaveType||LABEL[status]||status),body());
    function sync(){const s=$('rangeStart'),e=$('rangeEnd');if(s)s.value=range.start;if(e)e.value=range.end;const text=$('rangeText'),days=$('rangeDays'),n=datesBetween(range.start,range.end).length;if(text)text.textContent=range.start+' → '+range.end;if(days)days.textContent=n+' day'+(n===1?'':'s');renderCalendar()}
    function renderCalendar(){const host=$('calendarHost');if(!host)return;host.innerHTML=calendarHtml(range.month,range.start,range.end);$('calPrev').onclick=()=>{range.month=new Date(range.month.getFullYear(),range.month.getMonth()-1,1);renderCalendar()};$('calNext').onclick=()=>{range.month=new Date(range.month.getFullYear(),range.month.getMonth()+1,1);renderCalendar()};$('calToday').onclick=()=>{const t=new Date();range.month=new Date(t.getFullYear(),t.getMonth(),1);range.start=iso(t);range.end=iso(t);range.anchorSet=false;sync()};document.querySelectorAll('[data-cal-day]').forEach(b=>b.onclick=()=>{const d=b.dataset.calDay;if(!range.anchorSet){range.start=d;range.end=d;range.anchorSet=true}else{if(d<range.start){range.end=range.start;range.start=d}else range.end=d;range.anchorSet=false}range.month=new Date(parseIso(d).getFullYear(),parseIso(d).getMonth(),1);sync()})}
    $('rangeStart').onchange=e=>{range.start=e.target.value;if(range.end<range.start)range.end=range.start;range.month=new Date(parseIso(range.start).getFullYear(),parseIso(range.start).getMonth(),1);range.anchorSet=true;sync()};$('rangeEnd').onchange=e=>{range.end=e.target.value<range.start?range.start:e.target.value;range.anchorSet=false;sync()};$('setEndDate').onclick=()=>{const v=$('durationValue').value;if(!v)return;range.end=addDuration(range.start,v,$('durationUnit').value);range.month=new Date(parseIso(range.start).getFullYear(),parseIso(range.start).getMonth(),1);range.anchorSet=false;sync()};$('rangeCancel').onclick=closeModal;$('rangeApply').onclick=()=>{if(!range.start||!range.end||range.end<range.start){setStatus('End date must be on or after start date.');return}datesBetween(range.start,range.end).forEach(d=>state.cells[key(emp,d)]={status:status,leaveType:leaveType||undefined});state.pendingRanges=state.pendingRanges.filter(r=>!(r.employeeKey===emp&&r.status===status&&(r.leaveType||'')===(leaveType||'')));state.pendingRanges.push({employeeKey:emp,status:status,leaveType:leaveType||undefined,startDate:range.start,endDate:range.end});state.activeDay=range.start;closeModal();setStatus((leaveType||LABEL[status]||status)+' applied from '+range.start+' to '+range.end+'.');render()};renderCalendar()}
  function moveWeek(n){const d=parseIso(state.date);d.setDate(d.getDate()+n);state.date=iso(d);$('date').value=state.date;seedWeek();render()}
  function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
  function escAttr(s){return escapeHtml(s)}
  function cssEscape(s){return String(s).replace(/([\\"'])/g,'\\$1')}
  function init(data){state.personnel=data.personnel||[];state.offices=data.offices||[];state.leaveTypes=data.leaveTypes||[];state.date=iso(new Date());if(data.resolvedUnit){state.camp=data.resolvedUnit.camp;state.office=data.resolvedUnit.office}else{state.camp=state.offices[0]?state.offices[0].camp:'';state.office=state.offices.find(o=>o.camp===state.camp)?.office||''}renderSelectors();seedWeek();render();setStatus(state.personnel.length+' personnel loaded from Google Sheets. Core Apps Script UI ready.');}
  $('camp').onchange=e=>{state.camp=e.target.value;state.office='';renderSelectors();seedWeek();render()};$('office').onchange=e=>{state.office=e.target.value;seedWeek();render()};$('date').onchange=e=>{state.date=e.target.value;seedWeek();render()};$('load').onclick=()=>{seedWeek();render();setStatus(officeRoster().length+' personnel loaded for '+state.office+'.')};$('prevWeek').onclick=()=>moveWeek(-7);$('nextWeek').onclick=()=>moveWeek(7);$('search').oninput=e=>{state.search=e.target.value;renderGrid()};
  google.script.run.withSuccessHandler(init).withFailureHandler(err=>setStatus('Error: '+(err&&err.message?err.message:err))).getBootstrapData(window.INITIAL_UNIT_KEY||'');
})();
</script>
