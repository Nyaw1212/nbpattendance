<script>
(function(){
const state={personnel:[],offices:[],pending:[],selected:new Set(),receiveSelected:new Set(),pendingSearch:''};const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const err=e=>e&&e.message?e.message:String(e||'Unknown error');
function status(s){$('movementStatus').textContent=s}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function unique(a){return [...new Set(a.filter(Boolean))]}
function renderSourceCamps(){const camps=unique(state.personnel.map(p=>p.camp)).sort();$('fromCamp').innerHTML='<option value="">Select camp…</option>'+camps.map(x=>'<option>'+esc(x)+'</option>').join('');renderSourceOffices()}
function renderSourceOffices(){const camp=$('fromCamp').value;const offices=unique(state.personnel.filter(p=>p.camp===camp).map(p=>p.office)).sort();$('fromOffice').innerHTML='<option value="">Select office…</option>'+offices.map(x=>'<option>'+esc(x)+'</option>').join('');state.selected.clear();renderRoster()}
function visiblePersonnel(){const camp=$('fromCamp').value,office=$('fromOffice').value,q=$('personnelSearch').value.trim().toLowerCase();return state.personnel.filter(p=>p.camp===camp&&p.office===office&&(!q||(p.fullName+' '+p.badgeNumber+' '+(p.position||'')).toLowerCase().includes(q)))}
function renderRoster(){const rows=visiblePersonnel();$('personnelRoster').innerHTML=rows.length?rows.map(p=>'<label class="person-row '+(state.selected.has(p.badgeNumber)?'selected':'')+'"><input type="checkbox" data-person="'+esc(p.badgeNumber)+'" '+(state.selected.has(p.badgeNumber)?'checked':'')+'><div><div class="person-name">'+esc(p.fullName)+'</div><div class="person-meta">Badge '+esc(p.badgeNumber)+'</div></div><div class="person-position">'+esc(p.position||'')+'</div></label>').join(''):'<div class="empty">No personnel found for this office.</div>';document.querySelectorAll('[data-person]').forEach(x=>x.onchange=()=>{x.checked?state.selected.add(x.dataset.person):state.selected.delete(x.dataset.person);renderRoster();renderTransferSummary()});renderTransferSummary()}
function renderTransferSummary(){const n=state.selected.size;$('selectedCount').textContent=n+' selected';$('createMovement').textContent='Transfer '+n+' Personnel';$('createMovement').disabled=!n;$('transferSummary').textContent=n?(n+' personnel selected from '+$('fromCamp').value+' / '+$('fromOffice').value):'Select personnel to transfer.'}
function renderDestination(){const camps=unique(state.offices.map(o=>o.camp));$('toCamp').innerHTML='<option value="">Select camp…</option>'+camps.map(x=>'<option>'+esc(x)+'</option>').join('');renderDestinationOffices()}
function renderDestinationOffices(){const c=$('toCamp').value;const rows=state.offices.filter(o=>o.camp===c).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));$('toOffice').innerHTML='<option value="">Select office…</option>'+rows.map(o=>'<option>'+esc(o.office)+'</option>').join('')}
function switchTab(which){const transfer=which==='transfer';$('transferView').hidden=!transfer;$('receiveView').hidden=transfer;$('tabTransfer').classList.toggle('active',transfer);$('tabReceive').classList.toggle('active',!transfer);if(!transfer)refreshPending()}
function renderPending(){const q=state.pendingSearch.toLowerCase();const rows=state.pending.filter(m=>!q||[m.fullName,m.employeeKey,m.fromCamp,m.fromOffice,m.toCamp,m.toOffice,m.adminOrderNo].join(' ').toLowerCase().includes(q));const n=state.pending.length;$('pendingCount').textContent=n;$('tabPendingCount').textContent=n;$('tabPendingCount').hidden=n===0;$('pendingList').innerHTML=rows.length?rows.map(m=>'<label class="movement-card '+(state.receiveSelected.has(m.movementId)?'selected':'')+'"><input type="checkbox" data-pending="'+esc(m.movementId)+'" '+(state.receiveSelected.has(m.movementId)?'checked':'')+'><div><h3>'+esc(m.fullName)+'</h3><small>Badge '+esc(m.employeeKey)+'</small><div class="route"><div><b>FROM</b>'+esc(m.fromCamp)+' / '+esc(m.fromOffice)+'</div><div class="route-arrow">→</div><div><b>TO</b>'+esc(m.toCamp)+' / '+esc(m.toOffice)+'</div></div><div class="movement-meta"><span><b>Admin Order:</b> '+esc(m.adminOrderNo)+'</span><span><b>Effective:</b> '+esc(m.effectiveDate)+'</span></div></div></label>').join(''):'<div class="empty">No pending personnel movements.</div>';document.querySelectorAll('[data-pending]').forEach(x=>x.onchange=()=>{x.checked?state.receiveSelected.add(x.dataset.pending):state.receiveSelected.delete(x.dataset.pending);renderPending()});renderReceiveSummary()}
function renderReceiveSummary(){const n=state.receiveSelected.size;$('receiveSelectedCount').textContent=n+' selected';$('receiveSelected').textContent='Receive '+n+' Personnel';$('receiveSelected').disabled=!n}
function createBulk(){const keys=[...state.selected],payload={employeeKeys:keys,toCamp:$('toCamp').value,toOffice:$('toOffice').value,adminOrderNo:$('adminOrderNo').value.trim(),adminOrderDate:$('adminOrderDate').value,effectiveDate:$('effectiveDate').value,remarks:$('remarks').value.trim()};if(!payload.toCamp||!payload.toOffice||!payload.adminOrderNo||!payload.effectiveDate){status('Destination, Admin Order No., and effective date are required.');return}const b=$('createMovement');b.disabled=true;b.textContent='Transferring…';status('Creating '+keys.length+' movement record'+(keys.length===1?'':'s')+'…');google.script.run.withSuccessHandler(r=>{state.selected.clear();$('adminOrderNo').value='';$('adminOrderDate').value='';$('remarks').value='';renderRoster();status(r.created+' personnel transferred and awaiting receipt.'+(r.skipped&&r.skipped.length?' '+r.skipped.length+' skipped.':''));refreshPending();try{parent.postMessage({type:'movement-pending-changed'},'*')}catch(_){}}).withFailureHandler(e=>{renderTransferSummary();status('Transfer failed: '+err(e))}).createPersonnelMovementsBulk(payload)}
function receiveBulk(){const ids=[...state.receiveSelected];if(!confirm('Receive '+ids.length+' selected personnel?\n\nLIST assignments and OFFICE_MOVEMENT history will be updated for successful receipts.'))return;const b=$('receiveSelected');b.disabled=true;b.textContent='Receiving…';status('Receiving '+ids.length+' personnel…');google.script.run.withSuccessHandler(r=>{state.receiveSelected.clear();status(r.received+' personnel received.'+(r.failed&&r.failed.length?' '+r.failed.length+' failed; review the pending list.':''));refreshBootstrap();try{parent.postMessage({type:'movement-pending-changed'},'*')}catch(_){}}).withFailureHandler(e=>{renderReceiveSummary();status('Receive failed: '+err(e))}).receivePersonnelMovementsBulk(ids)}
function refreshPending(){$('refreshPending').disabled=true;google.script.run.withSuccessHandler(rows=>{state.pending=rows||[];const valid=new Set(state.pending.map(x=>x.movementId));state.receiveSelected.forEach(x=>{if(!valid.has(x))state.receiveSelected.delete(x)});$('refreshPending').disabled=false;renderPending()}).withFailureHandler(e=>{$('refreshPending').disabled=false;status('Pending list failed: '+err(e))}).listPendingMovements()}
function refreshBootstrap(){google.script.run.withSuccessHandler(init).withFailureHandler(e=>status('Refresh failed: '+err(e))).getMovementBootstrap()}
function init(d){state.personnel=(d.personnel||[]).sort((a,b)=>a.fullName.localeCompare(b.fullName));state.offices=d.offices||[];state.pending=d.pending||[];renderSourceCamps();renderDestination();renderPending();$('effectiveDate').value=$('effectiveDate').value||today();status('Movement Center ready. '+state.personnel.length+' personnel loaded; '+state.pending.length+' pending receipt'+(state.pending.length===1?'':'s')+'.')}
$('fromCamp').onchange=renderSourceOffices;$('fromOffice').onchange=()=>{state.selected.clear();renderRoster()};$('personnelSearch').oninput=renderRoster;$('selectAllVisible').onclick=()=>{visiblePersonnel().forEach(p=>state.selected.add(p.badgeNumber));renderRoster()};$('clearSelected').onclick=()=>{state.selected.clear();renderRoster()};$('toCamp').onchange=renderDestinationOffices;$('createMovement').onclick=createBulk;$('tabTransfer').onclick=()=>switchTab('transfer');$('tabReceive').onclick=()=>switchTab('receive');$('pendingSearch').oninput=e=>{state.pendingSearch=e.target.value;renderPending()};$('selectAllPending').onclick=()=>{state.pending.filter(m=>!state.pendingSearch||[m.fullName,m.employeeKey,m.toOffice,m.adminOrderNo].join(' ').toLowerCase().includes(state.pendingSearch.toLowerCase())).forEach(m=>state.receiveSelected.add(m.movementId));renderPending()};$('clearPending').onclick=()=>{state.receiveSelected.clear();renderPending()};$('refreshPending').onclick=refreshPending;$('receiveSelected').onclick=receiveBulk;
google.script.run.withSuccessHandler(init).withFailureHandler(e=>status('Movement Center failed to load: '+err(e))).getMovementBootstrap();
})();
</script>
