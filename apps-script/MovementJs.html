<script>
(function(){
  const state={personnel:[],offices:[],pending:[],selectedEmployeeKey:'',pendingSearch:''};
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  function setStatus(msg){$('movementStatus').textContent=msg}
  function todayIso(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
  function selectedPerson(){return state.personnel.find(p=>p.badgeNumber===state.selectedEmployeeKey)||null}
  function renderPersonnel(){const q=$('personnelSearch').value.trim().toLowerCase();const rows=state.personnel.filter(p=>!q||p.fullName.toLowerCase().includes(q)||p.badgeNumber.toLowerCase().includes(q)).slice(0,100);$('personnelSelect').innerHTML=rows.map(p=>'<option value="'+esc(p.badgeNumber)+'">'+esc(p.fullName)+' · '+esc(p.badgeNumber)+'</option>').join('');if(state.selectedEmployeeKey&&rows.some(p=>p.badgeNumber===state.selectedEmployeeKey))$('personnelSelect').value=state.selectedEmployeeKey}
  function renderCurrentAssignment(){const p=selectedPerson(),box=$('currentAssignment');if(!p){box.className='assignment-card muted';box.textContent='Select personnel to see the current assignment.';$('movementPosition').value='';return}box.className='assignment-card';box.innerHTML='<strong>'+esc(p.fullName)+'</strong><br>Badge '+esc(p.badgeNumber)+'<br>Current assignment: <strong>'+esc(p.camp)+' / '+esc(p.office)+'</strong>'+(p.position?'<br>Position: <strong>'+esc(p.position)+'</strong>':'');$('movementPosition').value=p.position||''}
  function renderDestinationCamps(){const camps=[...new Set(state.offices.map(o=>o.camp))];$('toCamp').innerHTML='<option value="">Select camp…</option>'+camps.map(c=>'<option>'+esc(c)+'</option>').join('');renderDestinationOffices()}
  function renderDestinationOffices(){const camp=$('toCamp').value;const offices=state.offices.filter(o=>o.camp===camp).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));$('toOffice').innerHTML='<option value="">Select office…</option>'+offices.map(o=>'<option>'+esc(o.office)+'</option>').join('')}
  function renderNotification(){const count=state.pending.length;const box=$('movementNotification'),n=$('movementNotificationCount');if(n)n.textContent=count;if(box)box.hidden=count===0}
  function renderPending(){const q=state.pendingSearch.toLowerCase();const rows=state.pending.filter(m=>!q||[m.fullName,m.employeeKey,m.fromCamp,m.fromOffice,m.toCamp,m.toOffice,m.position,m.adminOrderNo].join(' ').toLowerCase().includes(q));$('pendingCount').textContent=state.pending.length;renderNotification();$('pendingList').innerHTML=rows.length?rows.map(m=>'<article class="movement-card"><div class="movement-card-top"><div><h3>'+esc(m.fullName)+'</h3><small>Badge '+esc(m.employeeKey)+'</small></div><span class="status-chip pending">Pending Receipt</span></div><div class="route"><div><b>FROM</b>'+esc(m.fromCamp)+'<br>'+esc(m.fromOffice)+'</div><div class="route-arrow">→</div><div><b>TO</b>'+esc(m.toCamp)+'<br>'+esc(m.toOffice)+'</div></div><div class="movement-meta">'+(m.position?'<div><b>Position:</b> '+esc(m.position)+'</div>':'')+'<div><b>Admin Order:</b> '+esc(m.adminOrderNo)+'</div><div><b>Effective:</b> '+esc(m.effectiveDate)+'</div>'+(m.adminOrderDate?'<div><b>Order Date:</b> '+esc(m.adminOrderDate)+'</div>':'')+(m.remarks?'<div><b>Remarks:</b> '+esc(m.remarks)+'</div>':'')+'</div><div class="card-actions"><button class="receive-btn" data-receive="'+esc(m.movementId)+'">Receive Personnel</button></div></article>').join(''):'<div class="empty">No pending personnel movements.</div>';document.querySelectorAll('[data-receive]').forEach(btn=>btn.onclick=()=>receiveMovement(btn))}
  function createMovement(){const p=selectedPerson();const payload={employeeKey:p?p.badgeNumber:'',toCamp:$('toCamp').value,toOffice:$('toOffice').value,position:$('movementPosition').value.trim(),adminOrderNo:$('adminOrderNo').value.trim(),adminOrderDate:$('adminOrderDate').value,effectiveDate:$('effectiveDate').value,remarks:$('remarks').value.trim()};if(!payload.employeeKey||!payload.toCamp||!payload.toOffice||!payload.adminOrderNo||!payload.effectiveDate){setStatus('Complete the required fields before creating the transfer.');return}const btn=$('createMovement');btn.disabled=true;btn.textContent='Creating…';setStatus('Creating transfer record…');google.script.run.withSuccessHandler(result=>{btn.disabled=false;btn.textContent='Create Transfer';setStatus('Transfer created for '+result.person+'. Awaiting receipt at '+result.to+'.');$('adminOrderNo').value='';$('adminOrderDate').value='';$('remarks').value='';refreshPending()}).withFailureHandler(err=>{btn.disabled=false;btn.textContent='Create Transfer';setStatus('Create transfer failed: '+(err&&err.message?err.message:err))}).createPersonnelMovement(payload)}
  function receiveMovement(btn){const id=btn.dataset.receive,m=state.pending.find(x=>x.movementId===id);if(!m)return;if(!confirm('Receive '+m.fullName+' into '+m.toCamp+' / '+m.toOffice+'?\n\nThis will update LIST and create an OFFICE_MOVEMENT history record.'))return;btn.disabled=true;btn.textContent='Receiving…';setStatus('Receiving '+m.fullName+'…');google.script.run.withSuccessHandler(result=>{setStatus(result.person+' received. Current assignment is now '+result.assignment+'.');const p=state.personnel.find(x=>x.badgeNumber===m.employeeKey);if(p){p.camp=m.toCamp;p.office=m.toOffice;p.position=m.position||p.position}renderCurrentAssignment();refreshPending()}).withFailureHandler(err=>{btn.disabled=false;btn.textContent='Receive Personnel';setStatus('Receive failed: '+(err&&err.message?err.message:err))}).receivePersonnelMovement(id)}
  function refreshPending(){$('refreshPending').disabled=true;google.script.run.withSuccessHandler(rows=>{state.pending=rows||[];$('refreshPending').disabled=false;renderPending()}).withFailureHandler(err=>{$('refreshPending').disabled=false;setStatus('Pending list failed: '+(err&&err.message?err.message:err))}).listPendingMovements()}
  function init(data){state.personnel=(data.personnel||[]).sort((a,b)=>a.fullName.localeCompare(b.fullName));state.offices=data.offices||[];state.pending=data.pending||[];$('effectiveDate').value=todayIso();renderPersonnel();renderDestinationCamps();renderCurrentAssignment();renderPending();setStatus('Movement Center ready. '+state.personnel.length+' personnel loaded; '+state.pending.length+' pending receipt'+(state.pending.length===1?'':'s')+'.')}
  $('personnelSearch').oninput=renderPersonnel;$('personnelSelect').onchange=e=>{state.selectedEmployeeKey=e.target.value;renderCurrentAssignment()};$('toCamp').onchange=renderDestinationOffices;$('createMovement').onclick=createMovement;$('pendingSearch').oninput=e=>{state.pendingSearch=e.target.value;renderPending()};$('refreshPending').onclick=refreshPending;
  google.script.run.withSuccessHandler(init).withFailureHandler(err=>setStatus('Movement Center failed to load: '+(err&&err.message?err.message:err))).getMovementBootstrap();
})();
</script>
