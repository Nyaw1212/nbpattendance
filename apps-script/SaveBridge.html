<script>
(function(){
  function setMessage(msg){
    const a=document.getElementById('status'), b=document.getElementById('footerMessage');
    if(a) a.textContent=msg;
    if(b) b.textContent=msg;
  }

  function saveWeek(){
    const btn=document.getElementById('saveWeek');
    const app=window.NBPAttendanceApp;
    if(!app || typeof app.getSaveEntries!=='function' || typeof app.getContext!=='function'){
      setMessage('Save failed: attendance state bridge is not ready.');
      return;
    }

    const context=app.getContext();
    const entries=app.getSaveEntries();
    if(!entries.length){setMessage('Nothing to save.');return;}

    btn.disabled=true;
    btn.dataset.originalText=btn.dataset.originalText||btn.textContent;
    btn.textContent='Saving…';
    btn.classList.add('saving');
    setMessage('Saving '+entries.length+' attendance records to Neon…');

    google.script.run
      .withSuccessHandler(function(result){
        btn.disabled=false;
        btn.textContent=btn.dataset.originalText||'Save Week';
        btn.classList.remove('saving');
        if(result.backupOk===false){
          setMessage('Saved '+result.saved+' records to Neon. Backup warning: '+(result.backupWarning||'Google Sheets backup failed.'));
        }else{
          setMessage('Saved '+result.saved+' records to Neon and Google Sheets backup. Transaction '+result.transactionId+'.');
        }
      })
      .withFailureHandler(function(err){
        btn.disabled=false;
        btn.textContent=btn.dataset.originalText||'Save Week';
        btn.classList.remove('saving');
        setMessage('Save failed: '+(err&&err.message?err.message:err));
      })
      .saveAttendanceWeek({
        camp:context.camp,
        office:context.office,
        weekStart:context.weekStart,
        weekEnd:context.weekEnd,
        entries:entries
      });
  }

  function enable(){
    const btn=document.getElementById('saveWeek');
    if(!btn)return;
    btn.disabled=false;
    btn.title='Save this office/week to Neon and Google Sheets backup';
    btn.onclick=saveWeek;
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',enable);
  else enable();
})();
</script>
