<script>
(function(){
  const HOVER_DELAY_MS=450;
  const SAFE_LEFT_EDGE_PX=34;
  let hoverTimer=null;
  let pendingRow=null;

  function cancelPending(){
    if(hoverTimer){ clearTimeout(hoverTimer); hoverTimer=null; }
    pendingRow=null;
  }

  function scrollSummaryPersonIntoView(summaryRow){
    if(!summaryRow) return;
    const badge=summaryRow.dataset.summary;
    if(!badge) return;
    const grid=document.getElementById('gridWrap');
    if(!grid) return;
    const people=grid.querySelectorAll('.person-name[data-person]');
    let person=null;
    for(const el of people){
      if(el.dataset.person===badge){ person=el; break; }
    }
    if(!person) return;
    const row=person.closest('tr');
    if(!row) return;

    const gridRect=grid.getBoundingClientRect();
    const rowRect=row.getBoundingClientRect();
    const header=grid.querySelector('thead');
    const headerHeight=header ? header.getBoundingClientRect().height : 0;
    const visibleTop=gridRect.top+headerHeight;
    const visibleBottom=gridRect.bottom;

    if(rowRect.top < visibleTop || rowRect.bottom > visibleBottom){
      const target=grid.scrollTop+(rowRect.top-visibleTop)-12;
      grid.scrollTo({top:Math.max(0,target),behavior:'smooth'});
    }
  }

  // Auto-scroll only after the pointer deliberately rests inside the summary card.
  // The first 34px on the card's left edge is a dead zone so crossing over from
  // the attendance scrollbar cannot accidentally move the personnel list.
  document.addEventListener('mousemove',function(e){
    const row=e.target.closest && e.target.closest('.case-row[data-summary]');
    if(!row){ cancelPending(); return; }

    const rect=row.getBoundingClientRect();
    if(e.clientX < rect.left + SAFE_LEFT_EDGE_PX){
      cancelPending();
      return;
    }

    if(pendingRow===row) return;
    cancelPending();
    pendingRow=row;
    hoverTimer=setTimeout(function(){
      if(pendingRow===row) scrollSummaryPersonIntoView(row);
      hoverTimer=null;
    },HOVER_DELAY_MS);
  });

  document.addEventListener('mouseout',function(e){
    const row=e.target.closest && e.target.closest('.case-row[data-summary]');
    if(!row) return;
    if(e.relatedTarget && row.contains(e.relatedTarget)) return;
    if(pendingRow===row) cancelPending();
  });
})();
</script>
