<script>
(function(){
  const HOVER_DELAY_MS=350;
  const SAFE_LEFT_EDGE_PX=50;
  let hoverTimer=null;
  let pendingRow=null;

  function cancelPending(){
    if(hoverTimer){ clearTimeout(hoverTimer); hoverTimer=null; }
    pendingRow=null;
  }

  function clearGridHover(){
    document.querySelectorAll('.person-name').forEach(el=>el.classList.remove('hover-person'));
    document.querySelectorAll('.hover-cell').forEach(el=>el.classList.remove('hover-cell'));
    document.querySelectorAll('.hover-btn').forEach(el=>el.classList.remove('hover-btn'));
  }

  function scrollSummaryPersonIntoView(summaryRow){
    if(!summaryRow) return;
    const badge=summaryRow.dataset.summary;
    if(!badge) return;
    const grid=document.getElementById('gridWrap');
    if(!grid) return;

    const person=Array.from(grid.querySelectorAll('.person-name[data-person]'))
      .find(el=>el.dataset.person===badge);
    if(!person) return;

    person.classList.add('hover-person');
    const row=person.closest('tr');
    if(!row) return;

    const gridRect=grid.getBoundingClientRect();
    const rowRect=row.getBoundingClientRect();
    const header=grid.querySelector('thead');
    const headerHeight=header ? header.getBoundingClientRect().height : 0;
    const visibleTop=gridRect.top+headerHeight;
    const visibleBottom=gridRect.bottom;

    if(rowRect.top < visibleTop || rowRect.bottom > visibleBottom){
      const target=grid.scrollTop+(rowRect.top-visibleTop)-12;
      grid.scrollTo({top:Math.max(0,target),behavior:'smooth'});
    }
  }

  function activateRow(row){
    clearGridHover();
    scrollSummaryPersonIntoView(row);
  }

  function bindSummaryRows(){
    document.querySelectorAll('.case-row[data-summary]').forEach(function(row){
      if(row.dataset.safeHoverBound==='1') return;
      row.dataset.safeHoverBound='1';

      // Disable AppJs' original full-card hover target.
      row.onmouseenter=null;
      row.onmouseleave=null;

      row.addEventListener('mousemove',function(e){
        const rect=row.getBoundingClientRect();
        const insideActiveZone=e.clientX >= rect.left + SAFE_LEFT_EDGE_PX;

        if(!insideActiveZone){
          if(pendingRow===row) cancelPending();
          clearGridHover();
          return;
        }

        if(pendingRow===row) return;
        cancelPending();
        pendingRow=row;
        hoverTimer=setTimeout(function(){
          if(pendingRow===row) activateRow(row);
          hoverTimer=null;
        },HOVER_DELAY_MS);
      });

      row.addEventListener('mouseleave',function(){
        if(pendingRow===row) cancelPending();
        clearGridHover();
      });
    });
  }

  // Summary rows are rebuilt whenever the active date/status changes.
  const observer=new MutationObserver(bindSummaryRows);
  const start=function(){
    const list=document.getElementById('caseList');
    if(!list) return;
    observer.observe(list,{childList:true,subtree:true});
    bindSummaryRows();
  };

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
</script>
