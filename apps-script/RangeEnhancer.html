<script>
(function(){
  let dragging = false;
  let dragStart = '';
  let dragMoved = false;
  let suppressClick = false;

  function dayButton(target){
    return target && target.closest ? target.closest('[data-cal-day]') : null;
  }

  function setInputValue(id, value){
    const el = document.getElementById(id);
    if(!el) return;
    el.value = value;
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }

  document.addEventListener('pointerdown', function(e){
    const btn = dayButton(e.target);
    if(!btn) return;
    e.preventDefault();
    dragging = true;
    dragMoved = false;
    dragStart = btn.dataset.calDay || '';
    if(!dragStart) return;
    try { btn.setPointerCapture && btn.setPointerCapture(e.pointerId); } catch(_) {}
  }, true);

  document.addEventListener('pointerover', function(e){
    if(!dragging || !dragStart) return;
    const btn = dayButton(e.target);
    if(!btn) return;
    const d = btn.dataset.calDay || '';
    if(!d || d === dragStart) return;
    dragMoved = true;

    const start = d < dragStart ? d : dragStart;
    const end = d < dragStart ? dragStart : d;
    const s = document.getElementById('rangeStart');
    const en = document.getElementById('rangeEnd');
    if(!s || !en) return;

    s.value = start;
    en.value = end;
    s.dispatchEvent(new Event('change', { bubbles: true }));
    en.dispatchEvent(new Event('change', { bubbles: true }));
  }, true);

  document.addEventListener('pointerup', function(e){
    if(!dragging) return;
    const btn = dayButton(e.target);
    const endDay = btn && btn.dataset.calDay ? btn.dataset.calDay : dragStart;

    if(dragMoved && dragStart && endDay){
      const start = endDay < dragStart ? endDay : dragStart;
      const end = endDay < dragStart ? dragStart : endDay;
      const s = document.getElementById('rangeStart');
      const en = document.getElementById('rangeEnd');
      if(s && en){
        s.value = start;
        en.value = end;
        s.dispatchEvent(new Event('change', { bubbles: true }));
        en.dispatchEvent(new Event('change', { bubbles: true }));
      }
      suppressClick = true;
      setTimeout(function(){ suppressClick = false; }, 0);
    }

    dragging = false;
    dragStart = '';
    dragMoved = false;
  }, true);

  document.addEventListener('click', function(e){
    if(!suppressClick) return;
    const btn = dayButton(e.target);
    if(!btn) return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);

  document.addEventListener('dragstart', function(e){
    if(dayButton(e.target)) e.preventDefault();
  }, true);
})();
</script>
