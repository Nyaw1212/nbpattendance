<style>
  :root { font-family: Arial, Helvetica, sans-serif; color: #1f2a24; background: #edf3ef; }

  body { margin: 0; background: #edf3ef; }
  button, input, select { font: inherit; }

  .app-head p { margin: 5px 0 0; color: #647269; font-size: 13px; }

  button.primary { background: #2f6e46; color: #fff; border-color: #2f6e46; font-weight: 700; }

  .person-row b { font-size: 13px; }
  .person-row small { color:#718078; }
