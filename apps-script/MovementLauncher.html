<style>
.movement-launch-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid #d7e3da;border-radius:50%;background:#fff;cursor:pointer;font-size:21px;flex:0 0 auto}.movement-launch-btn:hover{background:#f8fbf9}.movement-launch-count{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#d93025;color:#fff;border:2px solid #edf7f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;line-height:1}.movement-launch-count[hidden]{display:none}.movement-modal-backdrop{position:fixed;inset:0;z-index:900;background:rgba(12,36,22,.45);display:flex;align-items:center;justify-content:center;padding:24px}.movement-modal-backdrop[hidden]{display:none}.movement-modal-card{width:min(1400px,96vw);height:min(860px,92vh);background:white;border-radius:16px;box-shadow:0 28px 90px rgba(0,0,0,.28);overflow:hidden;display:flex;flex-direction:column}.movement-modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#edf7f0;border-bottom:1px solid #d8e4db}.movement-modal-head strong{font-size:18px;color:#0e4929}.movement-modal-close{width:38px;height:38px;padding:0;border-radius:9px;border:1px solid #cad8ce;background:#fff;font-size:22px;cursor:pointer}.movement-modal-frame{width:100%;height:100%;border:0;background:#f4f8f5}
</style>
<script>
(function(){
  const btn=document.getElementById('movementLaunchBtn');
  const countEl=document.getElementById('movementLaunchCount');
  const modal=document.getElementById('movementModal');
  const closeBtn=document.getElementById('movementModalClose');
  const frame=document.getElementById('movementModalFrame');
  if(!btn||!countEl||!modal||!closeBtn||!frame)return;

  function renderCount(count){
    count=Math.max(0,Number(count)||0);
    countEl.textContent=count>99?'99+':String(count);
    countEl.hidden=count===0;
    btn.title=count>0?(count+' personnel due for receiving'):'Personnel Movement Center';
  }

  function refreshCount(){
    google.script.run
      .withSuccessHandler(renderCount)
      .withFailureHandler(function(err){console.warn('Movement badge unavailable:',err);})
      .getPendingMovementCount();
  }

  function openModal(){
    if(!frame.dataset.loaded){
      frame.src='?app=movement&embed=1';
      frame.dataset.loaded='1';
    }
    modal.hidden=false;
    document.body.style.overflow='hidden';
  }

  function closeModal(){
    modal.hidden=true;
    document.body.style.overflow='';
    refreshCount();
  }

  btn.addEventListener('click',openModal);
  closeBtn.addEventListener('click',closeModal);
  modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!modal.hidden)closeModal()});
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='movement-pending-changed')refreshCount()});

  refreshCount();
  setInterval(refreshCount,60000);
})();
</script>
